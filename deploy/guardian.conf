# Configuración del Guardián instalado como servicio (/etc/guardian, solo root).
usuario=__USUARIO__

# Carpetas protegidas. Las que no existan se omiten.
watch_dir=~/Documentos
watch_dir=~/Documents
watch_dir=~/Escritorio
watch_dir=~/Desktop
watch_dir=~/Imágenes
watch_dir=~/Pictures
# watch_dir=/media/usuario/MI_USB

log_file=/var/log/guardian/alertas.jsonl
pid_file=/run/guardian.pid
socket=/run/guardian/control.sock
boveda_dir=/var/lib/guardian/boveda

ventana_seg=5
umbral_eventos=50
umbral_archivos=20
umbral_critico=90
entropia=7.2            # bits/byte: por encima y sin cabecera de formato = "cifrado probable"
accion=congelar         # congelar | terminar | alerta

canarios=1              # archivos señuelo en las carpetas protegidas
canarios_prof=1         # niveles de subcarpetas con señuelos
boveda=1                # copia previa de archivos para poder restaurar
boveda_max_archivo_mb=16
boveda_max_total_mb=1024
boveda_ttl_min=240
notificar=1             # notificación de escritorio al usuario

net_activo=1
net_modo=alerta         # alerta | bloquear
net_umbral_bytes=5242880
net_ventana_seg=5
audit_dpkg=1
