# Configuración del Guardián. Rutas relativas se resuelven desde la carpeta del proyecto;
# "~" es el home del dueño del proyecto (no de root).

# Carpetas vigiladas (se pueden repetir). Incluye subcarpetas hasta 8 niveles.
watch_dir=/tmp/zona_cuarentena_test
# watch_dir=~/Documentos

# Detección por comportamiento (por proceso y por ventana de tiempo)
ventana_seg=5          # ancho de la ventana, en segundos
umbral_eventos=50      # archivos escritos por ventana que equivalen a 100 puntos
umbral_archivos=20     # archivos DISTINTOS mínimos para considerarlo crítico
umbral_critico=90      # puntaje desde el cual se actúa (60-89 = amarillo)

# Respuesta ante un proceso crítico: congelar (SIGSTOP) | terminar (SIGKILL) | alerta
accion=congelar

# Sensor de red (exfiltración). net_modo: alerta (solo registra) | bloquear (iptables + acción)
net_activo=1
net_modo=alerta
net_umbral_bytes=5242880   # 5 MB a una misma IP pública dentro de la ventana
net_ventana_seg=5

# Registrar instalaciones/eliminaciones de paquetes (/var/log/dpkg.log)
audit_dpkg=1
